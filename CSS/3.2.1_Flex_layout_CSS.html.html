<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            background-color: purple;
            padding: 10px;
            width: 900px;
            justify-content: right;
            border: 10px;
        }

        .container div {
            background-color: orange;
            border: 5px;
            padding: 5px;
            margin: 10px;
            cursor: pointer;
        }

        .caja1 {
            display: flex;
            list-style-type: none;
            background-color: orange;
            border: 5px solid black;
            padding: 10px;
            width: 70px;
            justify-content: left;
            flex-direction: row;
        }

        .caja {
            background-color: mediumseagreen;
            padding: 2px;
            margin: 2px;
        }

        .caja {
            color: black;
        }

        #nav {
            background-color: white;
        }

        #nav ul {
            display: flex;
            justify-content: 10px;
            list-style: 0px;
        }

        #nav ul li {
            background-color: maroon;
            padding: 10px 15px;
            width: 75px;
            border: 5px solid black;

        }

        #nav ul li:hover {
            background-color: black;
        }

        #nav ul li a {
            color: white;
            text-decoration: 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="caja">Botón 1</div>
        <div class="caja">Botón 2</div>
        <div class="caja">Botón 3</div>
        <div class="caja">Botón 4</div>
    </div>
    <div class="container2">
        <div class="caja1">Botón 1</div>
        <div class="caja1">Botón 2</div>
        <div class="caja1">Botón 3</div>
        <div class="caja1">Botón 4</div>
    </div>
    <nav id="nav">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>

</html>
